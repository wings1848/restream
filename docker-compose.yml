services:
  # PO Token provider — auto-generates YouTube authentication tokens.
  # Required for YouTube restreaming in 2026+. No manual cookie management.
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    init: true
    environment:
      TOKEN_TTL: 6  # hours, default 6h

  restream:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - pot-provider
    environment:
      - BILIBILI_STREAM_KEY=${BILIBILI_STREAM_KEY}
      # Optional HTTP proxy for YouTube access (if outside VPN/TUN)
      # - http_proxy=http://host.docker.internal:7897
      # - https_proxy=http://host.docker.internal:7897
    volumes:
      - ./config.yaml:/etc/restream/config.yaml:ro
    command:
      - "--config"
      - "/etc/restream/config.yaml"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
