name: Secrets

on:
  push:
    branches: [master]
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.88.2
        with:
          extra_args: --results=verified,unknown
